# =====================================================================
# Rand Water Quality v6 — Backend Configuration
# All secrets are provided via environment variables (set in Render)
# =====================================================================

# PostgreSQL (Neon)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:RandWaterSecretKey2026ForJWT_SecureLongerThan32Bytes_OK}
app.jwt.expiration-ms=86400000

# Logging
logging.level.randwater.quality=INFO
logging.level.org.hibernate.SQL=WARN

# In-memory admin user (legacy fallback — JWT is primary)
spring.security.user.name=${APP_ADMIN_USER:admin}
spring.security.user.password=${APP_ADMIN_PASS:admin123}

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000
